name: Build Windows executable
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build requirements
        run: python -m pip install pyinstaller==6.16.0 -r requirements-gui.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build GUI executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MarketValueHunter --collect-all keyring --add-data "example_listings.json;." app_gui.py
      - name: Test packaged GUI without network or personal settings
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'smoke-result.json'
          $process = Start-Process -FilePath '.\dist\MarketValueHunter.exe' -ArgumentList @('--smoke-test', $report) -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'GUI smoke test timed out' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'GUI smoke test failed' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.gui -ne 'ok' -or $result.mail -ne 'ok' -or $result.network_calls -ne 0) { throw 'Invalid smoke report' }
      - name: Include user guide and checksum
        shell: pwsh
        run: |
          Copy-Item README.md dist/README.md
          $hash = (Get-FileHash dist/MarketValueHunter.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  MarketValueHunter.exe" | Set-Content dist/SHA256SUMS.txt
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MarketValueHunter-Windows
          path: |
            dist/MarketValueHunter.exe
            dist/README.md
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
