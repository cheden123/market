name: Build Windows executable
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build requirements
        run: python -m pip install --upgrade pyinstaller keyring
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build GUI executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MarketValueHunter --collect-all keyring --add-data "example_listings.json;." app_gui.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MarketValueHunter-Windows
          path: dist/MarketValueHunter.exe
          if-no-files-found: error
          retention-days: 30
